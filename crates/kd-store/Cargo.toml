[package]
name = "kd-store"
description = "kd-store: module and Crafting Apps catalogues, Recent and Starred (SQLite), settings and file helpers (no UI)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
rusqlite.workspace = true
plist.workspace = true
directories.workspace = true

# System keychain: macOS Keychain, Windows Credential Manager, Linux Secret Service (libdbus is built in).
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", default-features = false, features = ["sync-secret-service", "crypto-rust", "vendored"] }

[dev-dependencies]
tempfile.workspace = true
