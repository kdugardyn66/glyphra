[workspace]
resolver = "3"
members = ["crates/kd-commands", "crates/kd-store", "crates/glyphra-i18n", "crates/glyphra-shell", "apps/glyphra"]

[workspace.package]
version = "0.1.2"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Kris Dugardyn"]
repository = "https://github.com/kdugardyn66/glyphra"
rust-version = "1.88"

[workspace.dependencies]
kd-commands = { path = "crates/kd-commands" }
kd-store = { path = "crates/kd-store" }
glyphra-i18n = { path = "crates/glyphra-i18n" }
glyphra-shell = { path = "crates/glyphra-shell" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
rusqlite = { version = "0.37", features = ["bundled"] }
plist = "1"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
