# Reverse proxy for the collaboration server (not there yet): HTTP API on /api/, WebSocket
# for live editing on /ws/. Until the server exists, nginx answers a health check only.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80;
    server_name _;

    location = /healthz { return 200 "ok\n"; add_header Content-Type text/plain; }

    # location /api/ { proxy_pass http://glyphra-server:7700; proxy_set_header Host $host; }
    # location /ws/  {
    #     proxy_pass http://glyphra-server:7700;
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection $connection_upgrade;
    #     proxy_read_timeout 1h;
    # }

    location / { return 404; }
}
