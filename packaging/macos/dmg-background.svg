<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400">
  <!-- Background of the Glyphra .dmg window. 640x400; the app icon is centred at (160,200) and Applications at (480,200) in the picture (the build script places them at y=155 in Finder's coordinates).
       Render with tools/gen_dmg_background.sh (1x and 2x PNG with the right DPI). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7F9FF"/>
      <stop offset="1" stop-color="#DDE7FB"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="0.85" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowAmber" cx="0.05" cy="1" r="0.55">
      <stop offset="0" stop-color="#FBBF24" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#FBBF24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="arrow" gradientUnits="userSpaceOnUse" x1="247" y1="0" x2="394" y2="0">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#2F5DD6"/>
    </linearGradient>
    <symbol id="spark" viewBox="-10 -10 20 20">
      <path d="M0-10C1.2-4 4-1.2 10 0 4 1.2 1.2 4 0 10-1.2 4-4 1.2-10 0-4-1.2-1.2-4 0-10Z"/>
    </symbol>
  </defs>

  <rect width="640" height="400" fill="url(#bg)"/>
  <rect width="640" height="400" fill="url(#glowBlue)"/>
  <rect width="640" height="400" fill="url(#glowAmber)"/>

  <!-- the logo's hexagon with its three nodes, large and faint, bleeding off the top-right corner -->
  <g fill="none" stroke="#38BDF8" stroke-opacity="0.16" stroke-width="10" stroke-linejoin="round">
    <path d="M560 -40 L650 12 L650 116 L560 168 L470 116 L470 12 Z"/>
  </g>
  <g fill="#38BDF8" fill-opacity="0.18">
    <circle cx="560" cy="-40" r="16"/><circle cx="470" cy="116" r="16"/><circle cx="650" cy="116" r="16"/>
  </g>

  <!-- title -->
  <text x="320" y="64" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="600" letter-spacing="-0.4" fill="#0F1829">Glyphra</text>
  <g fill="#FBBF24"><use href="#spark" x="371" y="38" width="14" height="14"/><use href="#spark" x="387" y="30" width="8" height="8"/></g>
  <text x="320" y="90" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#5B6B86">Markdown · PDF · Drawing, with Glyphra AI</text>

  <!-- arrow from the app to the Applications folder -->
  <g fill="none" stroke="url(#arrow)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M247 200 H382" stroke-dasharray="0.1 11"/>
    <path d="M373 187 L394 200 L373 213"/>
  </g>

  <text x="320" y="346" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#5B6B86">Drag Glyphra to the Applications folder to install</text>
</svg>
