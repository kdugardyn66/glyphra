name: ci
on: [push, pull_request]
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "clippy, rustfmt" }
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev libssl-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  package:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: DMG_LAYOUT=0 ./build.sh   # no Finder in CI: plain .dmg without the background
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: ./build.sh
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # WiX 5.0.2: the tool and its UI extension must be the same version (newer releases
          # carry the Open Source Maintenance Fee terms)
          dotnet tool install --global wix --version 5.0.2
          if ($LASTEXITCODE -ne 0) { exit 1 }
          wix extension add --global WixToolset.UI.wixext/5.0.2
          if ($LASTEXITCODE -ne 0) { exit 1 }
          wix extension list --global
          ./scripts/build-windows.ps1 -Msi
      - uses: actions/upload-artifact@v6
        with: { name: "glyphra-${{ matrix.os }}", path: "dist/*" }
