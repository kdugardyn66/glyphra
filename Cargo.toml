[workspace]
resolver = "3"
members = ["crates/gl-templates", "crates/gl-store", "crates/gl-core", "crates/gl-ui", "apps/glyphra"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Kris Dugardyn"]
rust-version = "1.88"

[workspace.dependencies]
gl-templates = { path = "crates/gl-templates" }
gl-store = { path = "crates/gl-store" }
gl-core = { path = "crates/gl-core" }
gl-ui = { path = "crates/gl-ui" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
